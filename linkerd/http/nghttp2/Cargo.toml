[package]
name = "linkerd-http-nghttp2"
version = "0.1.0"
authors = ["Linkerd Developers <cncf-linkerd-dev@lists.cncf.io>"]
license = "Apache-2.0"
edition = "2021"
publish = false
description = """
HTTP/2 protocol engine backed by the system libnghttp2, presenting the same
http::Request/Response<Body> + tower::Service surface as the hyper-based
engine so the linkerd proxy stack runs unchanged on top of it.
"""

[dependencies]
bytes = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std"] }
http = { workspace = true }
http-body = { workspace = true }
tokio = { version = "1", features = ["io-util", "time", "sync", "macros", "rt"] }
tokio-util = { version = "0.7" }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = { version = "0.1" }

linkerd-error = { path = "../../error" }
linkerd-http-box = { path = "../box" }
linkerd-http-h2 = { path = "../h2" }
linkerd-io = { path = "../../io" }

[dev-dependencies]
hyper = { workspace = true, features = ["client", "server", "http2"] }
hyper-util = { workspace = true, features = ["service", "tokio"] }
http-body-util = { workspace = true }
tokio = { version = "1", features = ["full"] }
pprof = { version = "0.15", features = ["protobuf-codec"] }

[[bench]]
name = "pair"
harness = false
